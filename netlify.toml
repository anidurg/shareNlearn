[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# The service worker and the manifest must never come from a stale cache, or an
# installed copy of the app would keep serving an old shell after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Chrome reads the share target out of the manifest, and it will only read a
# manifest it is served as one: the extension is not in Netlify's own type map,
# so it arrives as `application/octet-stream` and the whole file is ignored.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"
